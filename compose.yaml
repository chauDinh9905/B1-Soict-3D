# Môi trường dev. Mặc định chỉ chạy hạ tầng; code chạy trên máy bằng `npm run dev`.
#   docker compose up -d                         → postgres, redis, mailpit
#   docker compose --profile full up --build     → thêm cả API trong container
#   docker compose down -v                       → xóa sạch dữ liệu dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tour
      POSTGRES_PASSWORD: tour            # chỉ dùng cho dev
      POSTGRES_DB: tour
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro   # tạo thêm CSDL tour_test cho npm test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tour -d tour"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:                               # hộp thư giả cho giai đoạn B: xem email tại http://localhost:8025
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  api:
    profiles: ["full"]
    build: { context: ., dockerfile: server/Dockerfile }
    env_file: server/.env.docker
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata: {}
