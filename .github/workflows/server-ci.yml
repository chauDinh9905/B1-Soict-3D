name: server-ci
on:
  pull_request:
    paths: ["server/**", "web/public/data/**", ".github/workflows/server-ci.yml"]
  push:
    branches: [main]
    paths: ["server/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: tour, POSTGRES_PASSWORD: tour, POSTGRES_DB: tour_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tour" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://tour:tour@localhost:5432/tour_test
      REDIS_URL: redis://localhost:6379/1
      SESSION_SECRETS: chi-dung-cho-ci-chi-dung-cho-ci-0001
      APP_ORIGINS: http://localhost:5173
      CONTENT_DIR: ../web/public/data
      ADMIN_TOKEN: token-cu-chi-de-test
    steps:
      - uses: actions/checkout@v4          # không cần LFS: test không đọc model
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm audit --omit=dev --audit-level=high
        working-directory: server
      - name: Image Docker build được
        run: docker build -f server/Dockerfile -t b1-api:ci .
